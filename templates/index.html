<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body{
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            width: 90%;
            max-width: 800px;
        }

        .card{
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1{
            font-size: 40px;
            margin-bottom: 20px;
            color: #1e293b;
        }

        p{
            font-size: 18px;
            color: #64748b;
            margin-bottom: 35px;
        }

        a{
            text-decoration: none;
        }

        button{
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #1d4ed8;
        }

    </style>

</head>
<body>

    <div class="container">

        <div class="card">

            <h1>Student Exam Performance Predictor</h1>

            <p>
                Predict Maths Score using Machine Learning
            </p>

            <a href="/predictdata">
                <button>
                    Start Prediction
                </button>
            </a>

        </div>

    </div>

</body>
</html>
